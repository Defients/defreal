[workspace]
resolver = "2"
members = ["crates/defreal-dsp", "crates/defreal-audio", "src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "DefReal - real-time acoustic realism processor"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
defreal-dsp = { path = "crates/defreal-dsp" }
defreal-audio = { path = "crates/defreal-audio" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
